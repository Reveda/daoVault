<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAOVault logo animation</title>
<style>
:root{--bg:#050505;--gold:#f0b429;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050505}}
:root[data-theme="dark"]{--bg:#050505}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:var(--font,"Helvetica Neue",Arial,sans-serif)}
#wrap{position:relative}
.scene{position:absolute;left:0;top:0;width:460px;height:470px;transform-origin:0 0;perspective:1100px}
.rig{position:absolute;inset:0;transform-style:preserve-3d;animation:sway 12s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotateY(-20deg) rotateX(7deg)}to{transform:rotateY(20deg) rotateX(-3deg)}}
.emblem{position:absolute;left:0;top:20px;width:460px;height:320px;transform-style:preserve-3d;animation:intro 1.6s cubic-bezier(.2,.8,.2,1) both}
.emblem svg{position:absolute;left:0;top:0}
@keyframes intro{from{opacity:0;transform:translateZ(-300px) scale(.7)}to{opacity:1;transform:none}}
.glow{position:absolute;left:115px;top:113px;width:104px;height:104px;border-radius:50%;transform:translateZ(3px);background:radial-gradient(circle,#fffbe0 0,#ffe27a 38%,#e0a21a 75%,#7a4e00 100%);opacity:0;animation:glow 12s infinite}
@keyframes glow{0%,46%{opacity:0;transform:translateZ(3px) scale(.6)}56%,84%{opacity:1;transform:translateZ(3px) scale(1)}92%,100%{opacity:0;transform:translateZ(3px) scale(.6)}}
.door{position:absolute;left:115px;top:113px;width:104px;height:104px;transform-origin:0 50%;transform-style:preserve-3d;transform:translateZ(8px);animation:door 12s infinite}
@keyframes door{0%,46%{transform:translateZ(8px) rotateY(0)}58%,84%{transform:translateZ(8px) rotateY(-118deg)}93%,100%{transform:translateZ(8px) rotateY(0)}}
.spokes{transform-box:fill-box;transform-origin:center;animation:spin 12s infinite}
@keyframes spin{0%,36%{transform:rotate(0)}44%,88%{transform:rotate(90deg)}95%,100%{transform:rotate(0)}}
.key{position:absolute;left:167px;top:150px;width:130px;height:30px;transform-origin:0 50%;transform:translateZ(30px) translateX(240px);opacity:0;animation:key 12s infinite}
@keyframes key{0%{opacity:0;transform:translateZ(30px) translateX(240px) rotateX(0)}8%{opacity:1;transform:translateZ(30px) translateX(240px) rotateX(0)}28%{transform:translateZ(30px) translateX(0) rotateX(0)}36%{transform:translateZ(30px) translateX(0) rotateX(0)}44%{transform:translateZ(30px) translateX(0) rotateX(180deg)}48%{transform:translateZ(30px) translateX(0) rotateX(180deg);opacity:1}56%{transform:translateZ(30px) translateX(240px) rotateX(180deg);opacity:1}60%,100%{opacity:0;transform:translateZ(30px) translateX(240px) rotateX(0)}}
.word{position:absolute;left:0;top:352px;width:460px;text-align:center;font-weight:800;font-size:82px;letter-spacing:1px;line-height:1;transform:translateZ(0);animation:rise 1.4s .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.g{color:#f5b82e;text-shadow:0 1px #c98d12,0 2px #b97d08,0 3px #a46c05,0 4px #8f5d03,0 5px #7a4e00,0 8px 10px rgba(0,0,0,.8)}
.w{color:#f4f4f4;text-shadow:0 1px #d0d0d0,0 2px #bdbdbd,0 3px #a8a8a8,0 4px #939393,0 5px #7e7e7e,0 8px 10px rgba(0,0,0,.8)}
</style></head><body>
<div id="wrap"><div class="scene" id="scene"><div class="rig">
<div class="emblem" id="emblem"></div>
<div class="glow"></div>
<div class="door"><svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="Vault door">
<defs><radialGradient id="dg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffe27a"/><stop offset=".6" stop-color="#e0a21a"/><stop offset="1" stop-color="#9a6500"/></radialGradient></defs>
<circle cx="52" cy="52" r="49" fill="url(#dg)" stroke="#fff0a8" stroke-width="2"/>
<circle cx="52" cy="52" r="36" fill="none" stroke="#7a4e00" stroke-width="4"/>
<circle cx="52" cy="52" r="30" fill="#c98d12" stroke="#ffe27a" stroke-width="1.5"/>
<g class="spokes" stroke="#fff0a8" stroke-width="7" stroke-linecap="round"><line x1="52" y1="6" x2="52" y2="24"/><line x1="52" y1="80" x2="52" y2="98"/><line x1="6" y1="52" x2="24" y2="52"/><line x1="80" y1="52" x2="98" y2="52"/></g>
<circle cx="52" cy="52" r="14" fill="#ffd95a" stroke="#7a4e00" stroke-width="2"/>
<circle cx="52" cy="50" r="3.5" fill="#1a1100"/><path d="M50 52h4l1.5 7h-7z" fill="#1a1100"/>
</svg></div>
<div class="key"><svg width="130" height="30" viewBox="0 0 130 30" role="img" aria-label="Key">
<defs><linearGradient id="kg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="1" stop-color="#d9a017"/></linearGradient></defs>
<g fill="url(#kg)"><rect x="0" y="12" width="108" height="6" rx="2"/><rect x="6" y="18" width="7" height="9"/><rect x="18" y="18" width="7" height="6"/><path fill-rule="evenodd" d="M115 1a14 14 0 1 0 .1 0zM115 9a6 6 0 1 1-.1 0z"/></g></svg></div>
<div class="word"><span class="g">DAO</span><span class="w">Vault</span></div>
</div></div></div>
<script>
(function(){
var D="M30 30H190C270 30 310 90 310 150C310 210 270 260 190 260H60L30 230ZM70 70H185C235 70 265 105 265 150C265 195 235 220 185 220H70Z";
var V="262,120 306,120 340,205 385,95 430,95 352,290 322,290";
var em=document.getElementById('emblem'),h='',i;
function svg(z,fill,extra){return '<svg width="460" height="320" viewBox="0 0 460 320" style="transform:translateZ('+z+'px)" aria-hidden="true">'+extra+'<path fill-rule="evenodd" d="'+D+'" fill="'+fill+'"/><polygon points="'+V+'" fill="'+fill+'"/></svg>'}
for(i=14;i>=1;i--){var t=i/14,c=Math.round(150-60*t),d=Math.round(100-50*t);h+=svg(-i*1.6,'rgb('+c+','+d+',6)','')}
h+=svg(1,'url(#fg)','<defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset=".5" stop-color="#e8a820"/><stop offset="1" stop-color="#b97d08"/></linearGradient></defs>');
em.innerHTML=h;
var sc=document.getElementById('scene'),w=document.getElementById('wrap');
function fit(){var s=Math.min(innerWidth/500,innerHeight/520);sc.style.transform='scale('+s+')';w.style.width=460*s+'px';w.style.height=470*s+'px'}
fit();addEventListener('resize',fit);
})();
</script></body></html>
