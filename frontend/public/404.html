<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAOvault</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" type="image/png" sizes="224x224" href="/favicon-tab.png?v=3" />
  <!-- standalone: no scripts, no external files (Nginx shows it for every unknown address) -->
  <style>
    html, body { margin: 0; background: #050505; color: #fff; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem; padding: 2rem 1rem; box-sizing: border-box; text-align: center; background: radial-gradient(circle at 50% 40%, rgba(212, 175, 55, 0.08), transparent 45%), #050505; }
    .code { margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: clamp(4rem, 18vw, 7.5rem); font-weight: 700; line-height: 1; letter-spacing: 0.04em; background: linear-gradient(135deg, #f5d77a, #d4af37 55%, #a87a06); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 0; font-size: clamp(1.4rem, 5vw, 2rem); }
    p { margin: 0 0 0.6rem; max-width: 34ch; color: #b9bdc8; line-height: 1.55; }
    a { display: inline-block; padding: 0.8rem 1.6rem; border-radius: 999px; background: linear-gradient(135deg, #f5d77a, #d4af37); color: #1a1404; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 2px solid #f5d77a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a href="/">Go to home</a>
  </main>
</body>
</html>
