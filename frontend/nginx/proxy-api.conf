# /api/* -> backend (Express). X-Forwarded-For is REPLACED with the one real visitor IP (set from
# CF-Connecting-IP by default.conf), so the backend's TRUST_PROXY=1 reads it and a visitor
# cannot fake their IP to dodge the sign-in / money rate limits.
proxy_pass $api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;
