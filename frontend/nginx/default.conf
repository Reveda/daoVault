# DAOvault production gateway (docker-compose.prod.yml, service `web`).
# Cloudflare -> cloudflared (tunnel) -> this Nginx -> static site + /api/* to the `backend` service.
# Nginx is never published to the internet: only cloudflared and 127.0.0.1:8080 on the VPS reach it.

# per-IP request budgets, sized for shared mobile IPs (owner, 2026-10-13: launch traffic; one Jio /
# Airtel public IP can carry thousands of members). Cloudflare stops real floods before Nginx; the
# backend adds a per-wallet sign-in limit.
limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:20m rate=20r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    # the real visitor IP: Cloudflare puts it in CF-Connecting-IP; trust it only from the
    # Docker network cloudflared runs in (docker-compose.prod.yml `app` subnet)
    set_real_ip_from 172.28.0.0/24;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Docker's DNS: `backend` is looked up per request, so Nginx starts even while the API restarts.
    # It returns every backend copy (BACKEND_REPLICAS); Nginx spreads requests over them round
    # robin and retries the next copy when one is down (GET only; never re-sends a POST).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:5000;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: same origin as the site, so the httpOnly refresh cookie is first-party. ^~ keeps the
    # regex rules below away from API paths; the backend (helmet) sets the API security headers.
    location ^~ /api/v1/auth/ {
        limit_req zone=auth_per_ip burst=100 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }
    # live notifications (owner 2026-10-19): socket.io keeps a websocket open, so this path upgrades the
    # connection and allows long idle reads (the server pings every 25s). Cloudflare Tunnel passes websockets.
    location ^~ /api/v1/socket.io/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location ^~ /api/ {
        limit_req zone=api_per_ip burst=300 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Admin page + its own script and style exist only for signed-in admin wallets (owner,
    # 2026-10-11): the backend checks the dv_ag cookie; everyone else gets the normal 404 page.
    # Never cached by the browser or Cloudflare (private, no-store).
    location = /admin.html {
        auth_request /_admin_gate;
        error_page 401 403 =404 /404.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }
    location = /admin {
        auth_request /_admin_gate;
        error_page 401 403 =404 /404.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, no-store" always;
        try_files /admin.html =404;
    }
    location ^~ /static/admin- {
        auth_request /_admin_gate;
        error_page 401 403 =404 /404.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }
    location = /_admin_gate {
        internal;
        proxy_pass $api/api/v1/auth/admin-gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Vite build output (hashed file names): cache for a year
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # logo images / video from public/assets
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # never serve dotfiles, sources or maps
    location ~ /\. { deny all; return 404; }
    location ~* \.(map|ts|md)$ { return 404; }

    # pages (index.html, dashboard.html, admin.html): always revalidated so a deploy shows at once
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # unknown addresses: a plain "page not found" (public/404.html), never the landing page
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
