services:
  - type: web
    name: daovault-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: daovault-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://daovault-1.onrender.com
      - key: BSC_RPC_URL
        value: https://bsc-dataseed.binance.org/
      - key: BSC_CHAIN_ID
        value: 56
      - key: TRUST_PROXY
        value: 1
      - key: API_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: API_RATE_LIMIT_MAX
        value: 120
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: AUTH_RATE_LIMIT_MAX
        value: 20
      - key: FINANCIAL_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: FINANCIAL_RATE_LIMIT_MAX
        value: 20
      - key: LOG_REQUESTS
        value: true
      - key: SEED_WALLET_ADDRESS
        sync: false
      - key: SEED_ACTIVE_DIRECTS
        value: 0
      - key: SEED_EARNED_USD
        value: 0
      - key: USDT_CONTRACT_ADDRESS
        sync: false
      - key: COMPANY_WALLET_ADDRESS
        sync: false
      - key: PAYMENT_CONTRACT_ADDRESS
        sync: false
      - key: ACTIVATION_AMOUNT_USDT
        value: 300

  - type: web
    name: daovault-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    # /static = Vite build output with content hashes in the names: safe to cache for a year.
    # Pages stay revalidated so a new deploy shows at once; logo images/video cache a day.
    headers:
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      # security headers (keep Content-Security-Policy in sync with frontend/vite.config.js CSP)
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        value: https://daovault-2.onrender.com/api/v1
      - key: VITE_BSC_CHAIN_ID
        value: 56
      - key: VITE_BSC_RPC_URL
        value: https://bsc-dataseed.binance.org/
      - key: VITE_USDT_CONTRACT_ADDRESS
        sync: false
      - key: VITE_PAYMENT_CONTRACT_ADDRESS
        sync: false
      - key: VITE_ACTIVATION_AMOUNT_USDT
        value: 300
      # development lock: real-money payments stay off until this is set to "true" at launch
      - key: VITE_ALLOW_MAINNET_PAYMENTS
        value: "false"

databases:
  - name: daovault-db
    plan: free
