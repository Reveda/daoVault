# Production on a VPS (Hostinger). Plan and security: PRODUCTION-SETUP.md. Step by step: DOCKER.md.
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml --profile tunnel up -d --build
#   (+ --profile payouts once the payout signer is set up, + --profile offsite once rclone.conf exists)
#
# Needs two files on the server (never in git; templates: *.example):
#   .env.production            compose values: DB password, Cloudflare tunnel token, VITE_* (website build)
#   backend/.env.production    API settings: JWT secret, chain, contracts, company / admin wallets
#
# Nothing here is reachable from the internet except through the Cloudflare Tunnel:
#   Cloudflare -> cloudflared -> web (Nginx: site + /api) -> backend -> db
#   backend -> signer (payout voucher key; own internal network, no port, no internet)
# `web` is also on 127.0.0.1:8080 of the VPS only (checks over SSH; not public).

name: daovault

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # Sized for the 4-core / 16 GB VPS (owner, 2026-10-11): every core is used by
  #   backend x BACKEND_REPLICAS (Node is single-threaded: one copy per core) + Postgres (one
  #   process per connection, parallel queries) + Nginx (worker_processes auto = one per core).
  db:
    <<: *hardening
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - random_page_cost=1.1
    shm_size: 512m   # parallel queries use shared memory (Docker's default 64 MB is too small)
    environment:
      POSTGRES_USER: daovault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: daovault
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daovault -d daovault"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4g

  # shared rate-limit counters for all backend copies (no data worth keeping: nothing on disk)
  redis:
    <<: *hardening
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    <<: *hardening
    build:
      context: ./backend
      target: production
    image: daovault-backend:prod
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: "5000"
      # one proxy hop: Nginx replaces X-Forwarded-For with the real visitor IP
      TRUST_PROXY: "1"
      # 10 connections per copy: 3 copies = 30 of Postgres' 100
      DATABASE_URL: postgresql://daovault:${POSTGRES_PASSWORD}@db:5432/daovault?schema=public&connection_limit=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # instant withdrawals: vouchers are signed by the signer service (empty token = withdrawals closed)
      PAYOUT_SIGNER_URL: ${PAYOUT_SIGNER_URL:-}
      PAYOUT_SIGNER_TOKEN: ${PAYOUT_SIGNER_TOKEN:-}
    networks:
      - app      # Nginx in front + outbound internet (BSC RPC)
      - data     # database + redis
      - signer   # payout voucher signer
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    deploy:
      # one Node copy per core; Nginx sends each request to the next copy (round robin)
      replicas: ${BACKEND_REPLICAS:-3}
      resources:
        limits:
          memory: 1g

  # background jobs (BullMQ on Redis): chain indexer, voucher settlement, auth cleanup.
  # ONE copy only, so every job runs exactly once. Same image as the API.
  worker:
    <<: *hardening
    build:
      context: ./backend
      target: production
    image: daovault-backend:prod
    command: ["node", "dist/worker.js"]
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://daovault:${POSTGRES_PASSWORD}@db:5432/daovault?schema=public&connection_limit=5
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - app      # outbound internet (BSC RPC)
      - data     # database + redis
    depends_on:
      backend:
        condition: service_healthy   # the API applies the database migrations first
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512m

  # Payout voucher signer (owner, 2026-10-13: instant withdrawals, no admin review). Holds the ONE
  # key the DAOvaultPayout contract trusts; it never sends money and holds none. Only the API can
  # reach it (network `signer`: internal, no port on the VPS). Key = encrypted keystore + password,
  # files in ./secrets/signer (made by dist/signer/keygen.js), mounted read-only into this container only:
  # it never sees anything else in ./secrets (rclone.conf belongs to the offsite service). Start it with
  # --profile payouts once the payout contract is deployed (DOCKER.md, "Instant withdrawals").
  signer:
    <<: *hardening
    build:
      context: ./backend
      target: production
    image: daovault-backend:prod
    command: ["node", "dist/signer/server.js"]
    environment:
      NODE_ENV: production
      SIGNER_CHAIN_ID: ${SIGNER_CHAIN_ID:-97}
      SIGNER_PAYOUT_CONTRACT: ${SIGNER_PAYOUT_CONTRACT:-}
      SIGNER_TOKEN_DECIMALS: ${SIGNER_TOKEN_DECIMALS:-18}
      # the signer's own caps, on top of the contract's maxPerClaim / dailyLimit
      SIGNER_MAX_PER_CLAIM_USD: ${SIGNER_MAX_PER_CLAIM_USD:-1000}
      SIGNER_MAX_PER_DAY_USD: ${SIGNER_MAX_PER_DAY_USD:-10000}
      PAYOUT_SIGNER_TOKEN: ${PAYOUT_SIGNER_TOKEN:-}
      SIGNER_KEYSTORE_FILE: /run/secrets/payout_keystore.json
      SIGNER_KEYSTORE_PASSWORD_FILE: /run/secrets/payout_keystore_password.txt
    volumes:
      # read-only; only this container mounts it (files owned by uid 1000 = the image's node user)
      - ./secrets/signer:/run/secrets:ro
    networks:
      - signer
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    profiles:
      - payouts    # start with --profile payouts (needs ./secrets/signer and the payout contract)
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 192m

  web:
    <<: *hardening
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_BSC_CHAIN_ID: ${VITE_BSC_CHAIN_ID:?set VITE_BSC_CHAIN_ID (97 testnet / 56 mainnet)}
        VITE_BSC_RPC_URL: ${VITE_BSC_RPC_URL:-}
        VITE_USDT_CONTRACT_ADDRESS: ${VITE_USDT_CONTRACT_ADDRESS:-}
        VITE_PAYMENT_CONTRACT_ADDRESS: ${VITE_PAYMENT_CONTRACT_ADDRESS:-}
        VITE_ACTIVATION_AMOUNT_USDT: ${VITE_ACTIVATION_AMOUNT_USDT:-300}
        VITE_ALLOW_MAINNET_PAYMENTS: ${VITE_ALLOW_MAINNET_PAYMENTS:-false}
        VITE_LAUNCH_DATE: ${VITE_LAUNCH_DATE:-}
    image: daovault-web:prod
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m

  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:2024.12.2
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.production}
    networks:
      - app
    depends_on:
      - web
    profiles:
      - tunnel     # start with --profile tunnel (left out for a first check on 127.0.0.1:8080)
    deploy:
      resources:
        limits:
          memory: 256m

  backup:
    <<: *hardening
    image: postgres:16-alpine
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: daovault
      PGDATABASE: daovault
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    networks:
      - data     # only the database (no internet)
    depends_on:
      db:
        condition: service_healthy

  # Off-site copy of ./backups (owner, 2026-10-13): encrypted on the VPS by an rclone crypt remote,
  # then stored with a cloud provider (Backblaze B2 / Cloudflare R2 / Google Drive...). If the VPS
  # disk dies, yesterday's database still exists. Start with --profile offsite after creating
  # ./secrets/rclone.conf (DOCKER.md "Off-site backup").
  offsite:
    <<: *hardening
    image: rclone/rclone:1.68.2
    entrypoint: ["sh", "/offsite.sh"]
    environment:
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-daovault-crypt:}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
    volumes:
      - ./docker/backup/offsite.sh:/offsite.sh:ro
      - ./backups:/backups:ro
      - ./secrets/rclone.conf:/config/rclone/rclone.conf:ro
    networks:
      - app      # outbound internet (cloud storage); no database access
    depends_on:
      - backup
    profiles:
      - offsite
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  app:
    ipam:
      config:
        - subnet: 172.28.0.0/24   # Nginx trusts CF-Connecting-IP only from this subnet
  data:
    internal: true                # no internet: only backend and backup reach the database
  signer:
    internal: true                # no internet: only the API reaches the payout signer

volumes:
  pgdata:
